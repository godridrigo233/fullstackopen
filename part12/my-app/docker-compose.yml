services:
  frontend:
    build: ./frontend

  backend:
    build: ./backend
    environment:
      MONGODB_URI: mongodb://mongo:27017/bloglist
      PORT: 3003
      SECRET: ${BLOG_SECRET:?Set BLOG_SECRET before starting production}
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - bloglist_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  bloglist_prod_data: