services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bloglist
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bloglist/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bloglist"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./bloglist/backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bloglist
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./bloglist/frontend

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./bloglist/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8082:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data: