name: Part 14 end-to-end tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nextjs_blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nextjs_blog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: part14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Configure test environment
        run: |
          printf '%s\n' \
            'DATABASE_URL=postgres://postgres:postgres@localhost:5432/nextjs_blog_test' \
            'NEXTAUTH_SECRET=github-actions-test-only-secret' \
            'NEXTAUTH_URL=http://localhost:3000' > .env.test

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Run Playwright tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: part14/playwright-report/
          retention-days: 30
